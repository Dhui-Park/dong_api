<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주소 관할동 찾기_v6_Singapore</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #dce8ed url("/singapore_background.png") center / cover
          no-repeat;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 10px;
        font-size: 1.8rem;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 0.95rem;
      }

      .upload-area {
        border: 3px dashed #f48fb1;
        border-radius: 15px;
        padding: 40px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        background: #fff1f5;
      }

      .upload-area:hover {
        background: #ffe4ec;
        border-color: #ec407a;
      }

      .upload-area.dragover {
        background: #f8bbd0;
        border-color: #ec407a;
      }

      .upload-icon {
        font-size: 3rem;
        margin-bottom: 15px;
      }

      .upload-text {
        color: #555;
        font-size: 1.1rem;
      }

      .upload-hint {
        color: #888;
        font-size: 0.85rem;
        margin-top: 10px;
      }

      #fileInput {
        display: none;
      }

      .file-info {
        background: #f0f0f0;
        padding: 15px;
        border-radius: 10px;
        margin-top: 20px;
        display: none;
      }

      .file-info.show {
        display: block;
      }

      .file-name {
        font-weight: bold;
        color: #333;
      }

      .btn {
        display: block;
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        cursor: pointer;
        margin-top: 20px;
        transition: all 0.3s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, #f8bbd0 0%, #ec407a 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(236, 64, 122, 0.35);
      }

      .btn-primary:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .status {
        text-align: center;
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        display: none;
      }

      .status.show {
        display: block;
      }

      .status.processing {
        background: #fff3cd;
        color: #856404;
      }

      .status.success {
        background: #d4edda;
        color: #155724;
      }

      .status.error {
        background: #f8d7da;
        color: #721c24;
      }

      .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #ec407a;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 10px;
        vertical-align: middle;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .instructions {
        margin-top: 30px;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 10px;
      }

      .instructions h3 {
        color: #333;
        margin-bottom: 10px;
        font-size: 1rem;
      }

      .instructions ul {
        color: #666;
        padding-left: 20px;
        font-size: 0.9rem;
      }

      .instructions li {
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>주소 관할동 찾기_v6_Singapore</h1>
      <p class="subtitle">
        엑셀 파일의 주소로 관할 동사무소를 싱가포르에서 자동으로 찾아드립니다
      </p>
      <p class="subtitle">
        ( 261110 서버의 위치를 US -> 싱가포르로 변경하였습니다.)
      </p>

      <!-- <p class="subtitle">
        ( 261109 한글 이후에 바로 숫자-숫자 형태 오는 것 띄어쓰기 하기 )
      </p>
      <p class="subtitle">
        ( 261019 열람 동사무소 -> 띄어쓰기 제거 후 로직 태우기 )
      </p>
      <p class="subtitle">('거제', '읍면' 버그 수정)</p>
      <p class="subtitle">
        ( 260206 '열람 동사무소(조사업체)' 컬럼 무조건 포함되어야 하던 것
        업데이트)
      </p>
      <p class="subtitle">( 260420 api 호출 시 병목현상 업데이트 )</p>
      <p class="subtitle">
        ( 260519 병목현상 재발 -> 1차 빠른 모드로 api 호출 -> 2차 정밀 모드로
        api 호출 )
      </p> -->

      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📁</div>
        <div class="upload-text">파일을 여기에 드래그하거나 클릭하세요</div>
        <div class="upload-hint">.xlsx, .xls, .csv 파일 지원</div>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
      </div>

      <div class="file-info" id="fileInfo">
        <span class="file-name" id="fileName"></span>
      </div>

      <button class="btn btn-primary" id="processBtn" disabled>
        변환 시작
      </button>

      <div class="status" id="status"></div>

      <div class="instructions">
        <h3>사용 방법</h3>
        <ul>
          <li>엑셀 파일에 <strong>'주소'</strong> 컬럼이 있어야 합니다</li>
          <li>각 주소에 대해 관할동, 시군구, 시도 정보가 추가됩니다</li>
          <li>처리 완료 후 자동으로 결과 파일이 다운로드됩니다</li>
        </ul>
      </div>
    </div>

    <script>
      const uploadArea = document.getElementById("uploadArea");
      const fileInput = document.getElementById("fileInput");
      const fileInfo = document.getElementById("fileInfo");
      const fileName = document.getElementById("fileName");
      const processBtn = document.getElementById("processBtn");
      const status = document.getElementById("status");
      const EXCEL_MIME_TYPE =
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

      let selectedFile = null;
      let activeJobId = null;
      let statusPollTimer = null;

      uploadArea.addEventListener("click", () => fileInput.click());

      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadArea.classList.add("dragover");
      });

      uploadArea.addEventListener("dragleave", () => {
        uploadArea.classList.remove("dragover");
      });

      uploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadArea.classList.remove("dragover");
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          handleFile(files[0]);
        }
      });

      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) {
          handleFile(e.target.files[0]);
        }
      });

      function handleFile(file) {
        if (!file.name.match(/\.(xlsx|xls|csv)$/i)) {
          showStatus(
            "엑셀 또는 CSV 파일(.xlsx, .xls, .csv)만 업로드 가능합니다",
            "error"
          );
          return;
        }
        selectedFile = file;
        fileName.textContent = file.name;
        fileInfo.classList.add("show");
        processBtn.disabled = false;
        hideStatus();
      }

      function isJsonResponse(response) {
        const contentType = response.headers.get("content-type") || "";
        return contentType.includes("application/json");
      }

      function isExcelResponse(response) {
        const contentType = response.headers.get("content-type") || "";
        return (
          contentType.includes(EXCEL_MIME_TYPE) ||
          contentType.includes("application/octet-stream")
        );
      }

      async function fetchLatestProcessStatus() {
        try {
          const response = await fetch("/api/process-status/latest", {
            cache: "no-store",
          });

          if (!response.ok) {
            return null;
          }

          return await response.json();
        } catch (error) {
          return null;
        }
      }

      async function fetchJobStatus(jobId) {
        const response = await fetch(`/api/process-excel-jobs/${jobId}`, {
          cache: "no-store",
        });

        if (!response.ok) {
          throw new Error(await getErrorMessage(response));
        }

        return await response.json();
      }

      function formatProcessStatusMessage(status, responseStatus) {
        const lines = [`서버 오류 (${responseStatus})`];

        if (typeof status.lastCompletedRow === "number") {
          lines.push(`마지막 완료 행: ${status.lastCompletedRow}`);
        }

        if (typeof status.lastStartedRow === "number") {
          lines.push(`마지막 시작 행: ${status.lastStartedRow}`);
        }

        if (status.likelyCause) {
          lines.push(`추정 원인: ${status.likelyCause}`);
        }

        if (status.lastAddress) {
          lines.push(`마지막 주소: ${status.lastAddress}`);
        }

        return lines.join("<br>");
      }

      function formatJobStatusMessage(job) {
        const lines = [
          '<span class="spinner"></span>자동 2단계 처리 중입니다...',
        ];

        if (job.phase === "fast") {
          lines.push(
            `1차 빠른 처리: ${job.fastCompletedRows || 0} / ${
              job.totalRows || 0
            }`
          );
        } else if (job.phase === "precise") {
          lines.push(
            `1차 빠른 처리 완료: ${job.totalRows || 0} / ${job.totalRows || 0}`
          );
          lines.push(
            `2차 정밀 재처리: ${job.preciseCompletedRows || 0} / ${
              job.preciseTargetRows || 0
            }`
          );
        } else if (job.phase === "completed") {
          lines.push("완료: 결과 파일을 준비했습니다.");
        }

        if (typeof job.lastCompletedRow === "number") {
          lines.push(`마지막 완료 행: ${job.lastCompletedRow}`);
        }

        if (job.likelyCause) {
          lines.push(`상태: ${job.likelyCause}`);
        }

        return lines.join("<br>");
      }

      async function getErrorMessage(response) {
        if (isJsonResponse(response)) {
          try {
            const payload = await response.json();
            if (payload && payload.error) {
              return payload.error;
            }
          } catch (error) {
            // JSON 응답이지만 본문이 손상된 경우 일반 오류 메시지로 대체
          }
        }

        const text = await response.text();
        const normalized = text.trim().toLowerCase();

        if (response.status === 413 || text.includes("PayloadTooLargeError")) {
          return "파일이 너무 큽니다. 더 작은 파일을 사용해주세요.";
        }

        if (
          normalized.startsWith("<!doctype html") ||
          normalized.startsWith("<html")
        ) {
          const processStatus = await fetchLatestProcessStatus();

          if (processStatus) {
            return formatProcessStatusMessage(processStatus, response.status);
          }

          return `서버 오류 (${response.status}): 서버가 중간에 응답을 종료했습니다. 잠시 후 다시 시도해주세요.`;
        }

        return `서버 오류 (${response.status}): 파일 처리에 실패했습니다.`;
      }

      function sanitizeClientDownloadName(name) {
        const normalized = String(name || "result.xlsx")
          .replace(/[^\x20-\x7E]/g, "_")
          .replace(/["\\;,\r\n/]/g, "_")
          .replace(/\s+/g, "_")
          .replace(/_+/g, "_")
          .replace(/^_+|_+$/g, "");

        return normalized || "result.xlsx";
      }

      function buildClientDownloadName(originalFileName) {
        const base =
          "result_" +
          String(originalFileName || "result.xlsx").replace(
            /\.(xlsx|xls|csv)$/i,
            ".xlsx"
          );

        return sanitizeClientDownloadName(base);
      }

      async function downloadJobResult(jobId) {
        const response = await fetch(
          `/api/process-excel-jobs/${jobId}/download`
        );

        if (!response.ok) {
          throw new Error(await getErrorMessage(response));
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = buildClientDownloadName(selectedFile?.name);
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        a.remove();
      }

      function stopStatusPolling() {
        if (statusPollTimer) {
          clearTimeout(statusPollTimer);
          statusPollTimer = null;
        }
      }

      async function pollJobStatus(jobId) {
        try {
          const job = await fetchJobStatus(jobId);

          if (job.status === "completed") {
            stopStatusPolling();
            await downloadJobResult(jobId);
            showStatus("처리 완료! 파일이 다운로드되었습니다", "success");
            processBtn.disabled = false;
            activeJobId = null;
            return;
          }

          if (job.status === "failed") {
            stopStatusPolling();
            processBtn.disabled = false;
            activeJobId = null;
            showStatus(
              [
                "작업이 중단되었습니다.",
                typeof job.lastCompletedRow === "number"
                  ? `마지막 완료 행: ${job.lastCompletedRow}`
                  : null,
                job.likelyCause ? `추정 원인: ${job.likelyCause}` : null,
                job.error ? `오류: ${job.error}` : null,
              ]
                .filter(Boolean)
                .join("<br>"),
              "error"
            );
            return;
          }

          showStatus(formatJobStatusMessage(job), "processing");
          statusPollTimer = setTimeout(() => pollJobStatus(jobId), 1500);
        } catch (error) {
          stopStatusPolling();
          processBtn.disabled = false;
          activeJobId = null;
          showStatus(error.message, "error");
        }
      }

      processBtn.addEventListener("click", async () => {
        if (!selectedFile) return;

        stopStatusPolling();
        processBtn.disabled = true;
        showStatus(
          '<span class="spinner"></span>작업을 생성하는 중입니다...',
          "processing"
        );

        const formData = new FormData();
        formData.append("file", selectedFile);

        try {
          const response = await fetch("/api/process-excel-jobs", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            throw new Error(await getErrorMessage(response));
          }

          const payload = await response.json();
          activeJobId = payload.jobId;
          showStatus(
            '<span class="spinner"></span>처리를 시작했습니다. 진행 상황을 확인하는 중입니다...',
            "processing"
          );
          await pollJobStatus(activeJobId);
        } catch (error) {
          showStatus(error.message, "error");
          processBtn.disabled = false;
        }
      });

      function showStatus(message, type) {
        status.innerHTML = message;
        status.className = "status show " + type;
      }

      function hideStatus() {
        status.className = "status";
      }
    </script>
  </body>
</html>
